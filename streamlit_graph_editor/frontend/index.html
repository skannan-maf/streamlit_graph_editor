<!DOCTYPE html>
<html>
<head>
    <title>Interactive Graph Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/standalone/umd/vis-network.min.js"></script>
    <script src="./streamlit-component-lib.js"></script>
    <style>
        #user_graph {
            width: 90%;
            height: 900px;
            border: 1px solid black;
        }
        /* 🌈 Context Menu - Modern Style */
        #contextMenu {
            display: none;
            position: absolute;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
            padding: 8px;
            z-index: 1000;
            border: 2px solid #007bff;
            min-width: 150px;
        }
        .menu-item {
            padding: 8px 15px;
            font-family: "Arial", sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: #007bff;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease-in-out;
        }
        .menu-item:hover {
            background: #007bff;
            color: white;
        }
        /* 🌟 Pop-up Modal - Modern Look */
        #popupForm {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            width: 300px;
            text-align: center;
            border: 2px solid #007bff;
        }
        /* ✨ Popup Title */
        #popupTitle {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 10px;
        }
        /* 🖍 Form Inputs */
        #popupContent input,
        #popupContent select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 20px;
        }
        /* 🎨 Stylish Buttons */
        button {
            padding: 10px 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease-in-out;
        }
        button:hover {
            opacity: 0.8;
        }
        button:first-of-type {
            background-color: #007bff;
        }
        button:last-of-type {
            background-color: #ff4444;
        }
        .vis-tooltip {
            font-size: 16px !important;  /* ✅ Increase tooltip font size */
            background-color: rgba(0, 0, 0, 0.8);  /* ✅ Darker background */
            color: white;  /* ✅ White text */
            padding: 8px;  /* ✅ More padding for readability */
            border-radius: 5px;  /* ✅ Rounded corners */
        }

    </style>
</head>
<body>
    <h1 id="graph_title" style="text-align: center; margin-bottom: 10px; color:blue"></h1>
    <div id="user_graph"></div>
    <div id="contextMenu">
        <div class="menu-item" onclick="openPopup('addNode')">Add Node</div>
        <div class="menu-item" onclick="openPopup('deleteNode')">Delete Node</div>
        <div class="menu-item" onclick="openPopup('addEdge')">Add Edge</div>
        <div class="menu-item" onclick="openPopup('deleteEdge')">Delete Edge</div>
        <div class="menu-item" onclick="openPopup('editNodeAttributes')">Edit node attributes</div>
    </div>
    
    <div id="popupForm">
        <h3 id="popupTitle"></h3>
        <form id="popupContent"></form>
        <button type="button" onclick="submitAction()">Submit</button>
        <button type="button" onclick="closePopup()">Cancel</button>
    </div>

    <script>
        let network = null;
        let nodes = null;
        let edges = null;
        let selectedNode = null;
        let selectedAction = null;
        let isTreeMode = false; // Tree validation mode
        let user_actions = null;
        let node_attribute_keys = null;

        function setNodeColors() {

            let inDegree = {};
            let outDegree = {};

            // ✅ Get a copy of nodes and edges as plain arrays
            let nodesArray = nodes.get();
            let edgesArray = edges.get();

            // Initialize degree tracking
            nodesArray.forEach(node => {
                inDegree[node.id] = 0;
                outDegree[node.id] = 0;
            });

            // Calculate in-degree and out-degree
            edgesArray.forEach(edge => {
                outDegree[edge.from] = (outDegree[edge.from] || 0) + 1;
                inDegree[edge.to] = (inDegree[edge.to] || 0) + 1;
            });

            // Assign colors based on degree
            nodesArray.forEach(node => {
                if (inDegree[node.id] === 0) {
                    node.color = { background: 'purple', border: 'black' };
                    node.font = { color: 'white' };
                } else if (outDegree[node.id] === 0) {
                    node.color = { background: 'green', border: 'black' };
                    node.font = { color: 'black' };
                } else {
                    node.color = { background: 'orange', border: 'black' };
                    node.font = { color: 'white' };
                }
            });

            nodes.update(nodesArray)
        }

        function initializeGraph(graphData, actions, treeMode, nodeAttributeKeys, graphTitle="Untitled graph", directed=true) {
            isTreeMode = treeMode;
            user_actions = actions;
            node_attribute_keys = nodeAttributeKeys;
            
            document.getElementById('graph_title').innerText = graphTitle

            if (!nodes) {
                // If nodes already present, then this function is called due to re-rendering of screen because user re-sized most likely
                // In such cases, we should not lose precious graph state by reinitializing things. Hence the IF check.
                nodes = new vis.DataSet(graphData.nodes);
                edges = new vis.DataSet(graphData.edges);
                setNodeColors()
            }

            let container = document.getElementById("user_graph");
            let data = { nodes: nodes, edges: edges };
            
            let hierarchical_layout = {
                hierarchical: {
                    enabled: true,
                    direction: "UD",
                    sortMethod: "directed",
                    nodeSpacing: 200, 
                    treeSpacing: 300
                }
            };

            let non_hierarchical_layout = {
                hierarchical_layout: {
                    enabled : false
                }
            };
            
            let directed_edge = {
                arrows: {
                    to: { enabled: true, scaleFactor: 1 }  // ✅ Adds arrow to the "to" node
                },
                color: "#848484",  // ✅ Set a nice edge color
                width: 2  // ✅ Make edges visible
            };

            let undirected_edge = {
                smooth: true
            }

            let options = {
                layout:  treeMode ? hierarchical_layout : non_hierarchical_layout,
                physics: !treeMode,
                interaction: { 
                    dragNodes: true, 
                    zoomView: true,
                    navigationButtons: true,
                    selectable: true,
                    hover: true,
                    dragView: true
                },
                nodes: {
                    shape: "circle",
                    size: 30,
                    font : {
                        size: 42,
                        color: "#ffffff"
                    },
                    color: { 
                        background: "#007bff", 
                        border: "#004080" 
                    }
                },
                edges: directed ? directed_edge : undirected_edge
            };

            network = new vis.Network(container, data, options);

            console.log('Viz network created:')
            console.log(network)
            console.log('Data used to create Viz network:')
            console.log(data)

            // Show context menu on right-click
            network.on("oncontext", function (params) {
                params.event.preventDefault();
                selectedNode = network.getNodeAt(params.pointer.DOM);
                showContextMenu(params.event);
            });

            // Hide menu when clicking outside
            document.addEventListener("click", function () {
                document.getElementById("contextMenu").style.display = "none";
            });

            // Call exportGraph() whenever nodes or edges change
            //nodes.on("*", exportGraph);
            //edges.on("*", exportGraph);

            // Finalize the height and fit the graph
            Streamlit.setFrameHeight(1000);
            network.fit()

        }

        function showContextMenu(event) {
            let menu = document.getElementById("contextMenu");
            menu.style.display = "block";
            menu.style.left = event.pageX + "px";
            menu.style.top = event.pageY + "px";
        }

        function openPopup(action) {
            selectedAction = action;
            let popup = document.getElementById("popupForm");
            let form = document.getElementById("popupContent");
            let title = document.getElementById("popupTitle");

            form.innerHTML = "";
            title.innerText = `Perform Action: ${action}`;

            if (action === "addNode") {
                form.innerHTML += `<label>Node Label: </label><input type="text" id="nodeLabel"><br>`;
                form.innerHTML += `<label>[Optional]Parent Node: </label><select id="parentNode">${generateNodeOptions(include_null=true)}</select><br>`;
            } else if (action === "deleteNode") {
                form.innerHTML += `<label>Select Node: </label><select id="deleteNode">${generateNodeOptions()}</select><br>`;
                if (isTreeMode) {
                    form.innerHTML += `<label>Delete subtree?</label><input type="checkbox" id="deleteSubtree"><br>`;
                }
            } else if (action === "addEdge") {
                form.innerHTML += `<label>Source Node: </label><select id="sourceNode">${generateNodeOptions()}</select><br>`;
                form.innerHTML += `<label>Target Node: </label><select id="targetNode">${generateNodeOptions()}</select><br>`;
            } else if (action === "deleteEdge") {
                form.innerHTML += `<label>Select Source Node: </label><select id="edgeSource">${generateNodeOptions()}</select><br>`;
                form.innerHTML += `<label>Select Target Node: </label><select id="edgeTarget">${generateNodeOptions()}</select><br>`;
            } else if (action === "editNodeAttributes") {
                if (node_attribute_keys.length === 0) {
                    // ✅ If no attribute keys, show message instead of inputs
                    form.innerHTML = `<p style="color: gray; font-size: 20px;">No attribute specification passed.</p>`;
                } else {
                    form.innerHTML += `<label>Select Node: </label><select id="attributeNode">${generateNodeOptions()}</select><br>`;
                    node_attribute_keys.forEach(key => {
                        form.innerHTML += `<label>${key}: </label><input type="text" id="node_attr_${key}" placeholder="Enter ${key}"><br>`;
                    });
                    //form.innerHTML += `<label>Attributes: </label><input type="text" id="nodeAttributes"><br>`;
                }
                // Attach onchange event to update the input field when node selection changes
                setTimeout(() => {
                    document.getElementById("attributeNode").addEventListener("change", fillNodeAttributePopup);
                    fillNodeAttributePopup();  // Auto-fill the first selected node's emails
                }, 100);
            }
            popup.style.display = "block";
            
            // ✅ Attach submit event listener to properly handle ENTER
            setTimeout(() => {
                popup.addEventListener("submit", function (event) {
                    event.preventDefault();  // ✅ Prevent default form submission
                    submitAction();  // ✅ Manually trigger submission logic
                });
            }, 100);
        }

        function fillNodeAttributePopup() {
            // This function initializes the popup fields for node attributes with existing values if any
            let nodeId = document.getElementById("attributeNode").value;
            let node = nodes.get(nodeId);
            //document.getElementById("nodeAttributes").value = node.attributes;
            node_attribute_keys.forEach(key => {
                document.getElementById(`node_attr_${key}`).value = node.attributes?.[key] || null;
            });
        }

        function setNodeAttributes() {
            let nodeId = document.getElementById("attributeNode").value;
            let node = nodes.get(nodeId);

            if (node) {
                let attributes = {};

                // ✅ Read each attribute from the pop-up form
                node_attribute_keys.forEach(key => {
                    let value = document.getElementById(`node_attr_${key}`).value.trim();
                    attributes[key] = value !== "" ? value : null;  // ✅ Use null if empty
                });

                // ✅ Store attributes in the node and update tooltip
                node.attributes = attributes;
                node.title = generateTooltip(node);  // ✅ Update tooltip with latest attributes
                nodes.update(node);
            }
        }


        function generateTooltip(node) {
            let tooltip = `${node.label}`;
            
            if (node.attributes && (Object.keys(node.attributes).length > 0)) {
                tooltip += "\nAttributes:";
                Object.entries(node.attributes).forEach(([key, value]) => {
                    tooltip += `\n- ${key}: ${value !== null ? value : "None"}`;
                });
            }
            return tooltip;
        }


        function generateNodeOptions(include_null=false) {
            let options = include_null ? `<option value="">(None)</option>` : "";

            options += nodes.get().map(n => `<option value="${n.id}">${n.label}</option>`).join("");
            //console.log("Options = ")
            //console.log(options)
            return options;
        }

        function closePopup() {
            document.getElementById("popupForm").style.display = "none";
        }

        function getSubtreeNodes(nodeId) {
            // Get subtree nodes of a Node, including that Node.
            console.assert(isTreeMode==true, "getSubtreeNodes called in a non-tree environment");

            let subtreeNodes = new Set();  // ✅ Use a Set to avoid duplicates
            function traverse(node) {
                if (!subtreeNodes.has(node)) {
                    subtreeNodes.add(node);
                    let children = network.getConnectedNodes(node, "to").filter(child => child !== nodeId);  // ✅ Avoid cycles
                    children.forEach(traverse);
                }
            }
            traverse(nodeId);
            return Array.from(subtreeNodes);  // ✅ Convert Set to array
        }

        function submitAction() {
            if (selectedAction === "addNode") {
                
                let nodeLabel = document.getElementById("nodeLabel").value.trim();
                let parent = document.getElementById("parentNode").value.trim();
                let nodeId = nodeLabel;
                
                if (nodes.get(nodeId)) {
                    alert("🚫 Node already exists! Choose a different ID.")
                    return;
                }

                nodes.add({ 
                    id: nodeId, 
                    label: nodeLabel
                });

                if (parent) {
                    edges.add({ from: parent, to: nodeId });
                }

            } else if (selectedAction === "deleteNode") {
                
                let nodeId = document.getElementById("deleteNode").value;
                let deleteSubtree = document.getElementById("deleteSubtree")
                let toRemove = null

                if (deleteSubtree) {

                    if (deleteSubtree.checked) {
                        toRemove = getSubtreeNodes(nodeId);
                        console.log('Delete subtree: Following to be deleted')
                        console.log(toRemove)
                    } else {
                        toRemove = [nodeId]
                    }

                    //Delete all edges which has reference to any node in "toRemove" and then remove the nodes
                    if (toRemove.length > 0) {
                        // ✅ Find and remove all edges connected to any node in `toRemove`
                        let edgesToDelete = edges.get({
                            filter: edge => toRemove.includes(edge.from) || toRemove.includes(edge.to)
                        });

                        console.log("Edges to delete:", edgesToDelete.map(edge => edge.id));

                        edges.remove(edgesToDelete.map(edge => edge.id));  // ✅ Remove edges first
                        nodes.remove(toRemove);  // ✅ Then remove the nodes

                        //exportGraph();  // ✅ Sync with Streamlit
                        //network.redraw();  // ✅ Refresh UI
                    } else {
                        alert("🚨 No subtree found for deletion!");
                    }
                }

            } else if (selectedAction === "addEdge") {
                
                let source = document.getElementById("sourceNode").value;
                let target = document.getElementById("targetNode").value;
                
                if (isTreeMode && hasParent(target)) {
                    alert("Tree mode: A node can only have one parent!");
                } else if (source !== target) {
                    edges.add({ from: source, to: target });
                }

            } else if (selectedAction === "deleteEdge") {
                let source = document.getElementById("edgeSource").value;
                let target = document.getElementById("edgeTarget").value;
                
                // ASSUMPTION: Directed graphs
                let edgeToDelete = edges.get({
                    filter: function (edge) {
                        return (edge.from === source && edge.to === target);
                    }
                });
                if (edgeToDelete.length > 0) {
                    edges.remove(edgeToDelete.map(edge => edge.id));
                } else {
                    alert("🚨 No matching edge found for deletion!");
                }
            } else if (selectedAction == 'editNodeAttributes') {
                setNodeAttributes();
            }
            exportGraph()
            closePopup();
        }

        function hasParent(nodeId) {
            return edges.get().some(edge => edge.to === nodeId);
        }

        function exportGraph() {

            setNodeColors();

            let graphJson = {
                nodes: nodes.get(),
                edges: edges.get()
            };
            
            Streamlit.setComponentValue(graphJson);
        }

        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, function (event) {
            initializeGraph(
                event.detail.args.graph_data, 
                event.detail.args.actions, 
                event.detail.args.treeMode, 
                event.detail.args.node_attribute_keys,
                event.detail.args.graph_title
            );
        });

        Streamlit.setComponentReady();
    </script>
</body>
</html>
